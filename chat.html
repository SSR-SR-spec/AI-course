<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Campus AI - 智能校园助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100%;
            width: 100%;
        }

        /* 侧边栏 */
        .sidebar {
            width: 260px;
            background: #f7f7f8;
            border-right: 1px solid #e4e4e7;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
        }

        .sidebar-header {
            padding: 16px 12px;
            border-bottom: 1px solid #e4e4e7;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #111827;
        }

        .logo-icon {
            font-size: 24px;
        }

        .new-chat-btn {
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            background: #059669;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            color: #374151;
            font-size: 14px;
        }

        .session-item:hover {
            background: #e8e8ec;
        }

        .session-item.active {
            background: #e8e8ec;
            font-weight: 500;
            color: #111827;
        }

        .session-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-session {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            visibility: hidden;
        }

        .session-item:hover .delete-session {
            visibility: visible;
        }

        .delete-session:hover {
            background: #f3f4f6;
            color: #ef4444;
        }

        .resize-handle {
            width: 4px;
            background: transparent;
            cursor: col-resize;
            position: absolute;
            right: -2px;
            top: 0;
            bottom: 0;
            z-index: 10;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: #cbd5e1;
        }

        /* 主聊天区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
            min-width: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .messages-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            padding: 0 20px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background: #e8f5e9;
            border-radius: 18px 18px 4px 18px;
            padding: 8px 16px;
        }

        .message.assistant .message-content {
            background: #f3f4f6;
            border-radius: 18px 18px 18px 4px;
            padding: 8px 16px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #10b981;
            order: 2;
        }

        .message-content {
            flex: 1;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            color: #111827;
        }

        .message-content * {
            color: #111827;
        }

        .message-content pre {
            background: #f6f8fa;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content code {
            background: #f6f8fa;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        .message-content ul,
        .message-content ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        /* 输入区域 */
        .input-area {
            padding: 12px 24px 20px;
            background: white;
            border-top: 1px solid #e4e4e7;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 16px;
            padding: 8px 12px;
        }

        .input-wrapper:focus-within {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        .input-text {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            line-height: 1.5;
            max-height: 150px;
            font-family: inherit;
            background: transparent;
            color: #111827;
        }

        .input-text::placeholder {
            color: #9ca3af;
        }

        .send-btn {
            background: #10b981;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }

        .send-btn:hover {
            background: #059669;
        }

        .send-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .info-note {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 8px;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 左侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <span class="logo-icon">🎓</span>
                <span>Campus AI</span>
            </div>
            <button class="new-chat-btn" id="newChatBtn">+ 新对话</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <!-- 中间聊天区域 -->
    <div class="main">
        <div class="chat-messages" id="chatMessages">
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message" style="text-align: center; padding: 60px 20px; color: #9ca3af;">
                    <div style="font-size: 48px; margin-bottom: 12px;">💬</div>
                    <div style="font-size: 18px; font-weight: 500; color: #111827;">有什么可以帮你的？</div>
                    <div style="font-size: 14px;">询问课程、生活、行政等各类校园问题</div>
                </div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea class="input-text" id="messageInput" rows="1" placeholder="给 Campus AI 发送消息..."></textarea>
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
            <div class="info-note">内容由 AI 生成，仅供参考</div>
        </div>
    </div>
</div>

<script>
    // ---------- 配置 ----------
    const API_URL = "/chat";  // 使用相对路径，自动匹配当前域名和端口
    let sessions = {};
    let sessionOrder = [];
    let currentSessionId = null;
    let isLoading = false;

    // ---------- 辅助函数 ----------
    function cleanCitations(text) {
        if (!text) return text;
        let cleaned = text.replace(/\[citation:\d+\]/g, '');
        cleaned = cleaned.replace(/\[\d+\]/g, '');
        cleaned = cleaned.replace(/\[\^\d+\]/g, '');
        cleaned = cleaned.replace(/\[\d+:\d+\]/g, '');
        return cleaned;
    }

    function renderMarkdown(text) {
        if (!text) return '';
        const cleaned = cleanCitations(text);
        let html = marked.parse(cleaned);
        setTimeout(() => {
            document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }, 10);
        return html;
    }

    // 保存数据到 localStorage
    function saveToLocal() {
        const data = {
            sessions: sessions,
            sessionOrder: sessionOrder,
            currentSessionId: currentSessionId
        };
        localStorage.setItem('campus_ai_sessions', JSON.stringify(data));
    }

    // 加载本地数据
    function loadFromLocal() {
        const raw = localStorage.getItem('campus_ai_sessions');
        if (!raw) {
            const defaultId = 'session_' + Date.now();
            sessions[defaultId] = [];
            sessionOrder = [defaultId];
            currentSessionId = defaultId;
            saveToLocal();
            return;
        }
        try {
            const data = JSON.parse(raw);
            sessions = data.sessions || {};
            sessionOrder = data.sessionOrder || [];
            currentSessionId = data.currentSessionId || (sessionOrder[0] || null);
            if (!currentSessionId && sessionOrder.length) currentSessionId = sessionOrder[0];
            if (Object.keys(sessions).length === 0) {
                const defaultId = 'session_' + Date.now();
                sessions[defaultId] = [];
                sessionOrder = [defaultId];
                currentSessionId = defaultId;
                saveToLocal();
            }
        } catch (e) { console.error(e); }
    }

    // 渲染侧边栏
    function renderSidebar() {
        const container = document.getElementById('sessionsList');
        if (!container) return;
        if (sessionOrder.length === 0) {
            container.innerHTML = '<div style="padding:12px;color:#9ca3af;">暂无对话</div>';
            return;
        }
        let html = '';
        for (let sid of sessionOrder) {
            const session = sessions[sid] || [];
            let title = '新对话';
            for (let msg of session) {
                if (msg.role === 'user') {
                    let t = msg.content;
                    if (t.length > 28) t = t.slice(0, 28) + '...';
                    title = t;
                    break;
                }
            }
            const activeClass = (sid === currentSessionId) ? 'active' : '';
            html += `
                <div class="session-item ${activeClass}" data-sid="${sid}">
                    <span class="session-title">${escapeHtml(title)}</span>
                    <button class="delete-session" data-sid="${sid}" title="删除会话">✕</button>
                </div>
            `;
        }
        container.innerHTML = html;

        // 绑定事件
        document.querySelectorAll('.session-item').forEach(el => {
            const sid = el.getAttribute('data-sid');
            if (!sid) return;
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('delete-session')) return;
                switchSession(sid);
            });
            const delBtn = el.querySelector('.delete-session');
            if (delBtn) {
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteSession(sid);
                });
            }
        });
    }

    // 渲染聊天区域
    function renderChat() {
        const container = document.getElementById('messagesContainer');
        if (!container) return;
        const messages = sessions[currentSessionId] || [];
        if (messages.length === 0) {
            container.innerHTML = `
                <div class="welcome-message" style="text-align:center;padding:60px 20px;color:#9ca3af;">
                    <div style="font-size:48px;">💬</div>
                    <div style="font-size:18px;font-weight:500;color:#111827;">有什么可以帮你的？</div>
                    <div style="font-size:14px;">询问课程、生活、行政等各类校园问题</div>
                </div>
            `;
            return;
        }
        let html = '';
        for (let msg of messages) {
            const roleClass = msg.role === 'user' ? 'user' : 'assistant';
            const avatar = msg.role === 'user' ? '我' : 'AI';
            const contentHtml = renderMarkdown(msg.content);
            html += `
                <div class="message ${roleClass}">
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">${contentHtml}</div>
                </div>
            `;
        }
        container.innerHTML = html;
        // 滚动到底部
        const chatDiv = document.getElementById('chatMessages');
        if (chatDiv) chatDiv.scrollTop = chatDiv.scrollHeight;
        // 高亮代码块
        document.querySelectorAll('.message-content pre code').forEach(block => {
            hljs.highlightElement(block);
        });
    }

    // 发送消息
    async function sendMessage() {
        if (isLoading) return;
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        // 添加用户消息
        const userMsg = { role: 'user', content: text };
        if (!sessions[currentSessionId]) sessions[currentSessionId] = [];
        sessions[currentSessionId].push(userMsg);
        renderChat();
        saveToLocal();
        renderSidebar();

        isLoading = true;
        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;

        // 临时添加“思考中”消息
        const thinkingMsg = { role: 'assistant', content: '⏳ 思考中...' };
        sessions[currentSessionId].push(thinkingMsg);
        renderChat();
        saveToLocal();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId, message: text, metadata: {} })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            let answer = data.final_answer || '❌ 未获取到回答';
            answer = cleanCitations(answer);

            // 替换最后一条消息（移除思考中，添加真实回答）
            sessions[currentSessionId].pop();
            sessions[currentSessionId].push({ role: 'assistant', content: answer });
            renderChat();
            saveToLocal();
            renderSidebar();
        } catch (err) {
            console.error(err);
            sessions[currentSessionId].pop();
            sessions[currentSessionId].push({ role: 'assistant', content: `❌ 请求失败：${err.message}` });
            renderChat();
            saveToLocal();
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    // 新建会话
    function newSession() {
        const newId = 'session_' + Date.now();
        sessions[newId] = [];
        sessionOrder.unshift(newId);
        currentSessionId = newId;
        renderSidebar();
        renderChat();
        saveToLocal();
    }

    // 切换会话
    function switchSession(sid) {
        if (!sessions[sid]) return;
        currentSessionId = sid;
        renderSidebar();
        renderChat();
        saveToLocal();
    }

    // 删除会话
    function deleteSession(sid) {
        if (!sessions[sid]) return;
        delete sessions[sid];
        const idx = sessionOrder.indexOf(sid);
        if (idx !== -1) sessionOrder.splice(idx, 1);
        if (sessionOrder.length === 0) {
            newSession();
        } else {
            if (currentSessionId === sid) {
                currentSessionId = sessionOrder[0];
            }
            renderSidebar();
            renderChat();
        }
        saveToLocal();
    }

    // 侧边栏宽度拖拽
    function initResize() {
        const sidebar = document.getElementById('sidebar');
        const handle = document.getElementById('resizeHandle');
        let startX, startWidth, isResizing = false;
        const onMouseMove = (e) => {
            if (!isResizing) return;
            let newWidth = startWidth + (e.clientX - startX);
            newWidth = Math.min(400, Math.max(160, newWidth));
            sidebar.style.width = newWidth + 'px';
        };
        const onMouseUp = () => {
            isResizing = false;
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            handle.classList.remove('active');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            localStorage.setItem('sidebarWidth', sidebar.style.width);
        };
        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX;
            startWidth = sidebar.offsetWidth;
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            document.body.style.userSelect = 'none';
            handle.classList.add('active');
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        const savedWidth = localStorage.getItem('sidebarWidth');
        if (savedWidth) sidebar.style.width = savedWidth;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 初始化
    function init() {
        loadFromLocal();
        renderSidebar();
        renderChat();
        initResize();
        const sendBtn = document.getElementById('sendBtn');
        const input = document.getElementById('messageInput');
        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        document.getElementById('newChatBtn').addEventListener('click', newSession);
    }

    init();
</script>
</body>
</html>
